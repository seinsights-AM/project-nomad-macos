# Project N.O.M.A.D. — macOS Docker Compose Configuration
#
# Differences from Linux version:
#   - No disk-collector sidecar (uses Linux-only lsblk, /proc, rslave mounts)
#   - No extra_hosts workaround (Docker Desktop for Mac resolves host.docker.internal natively)
#   - No NVIDIA GPU passthrough (Ollama runs natively on macOS for Metal GPU access)
#   - Volume paths use NOMAD_DIR_PLACEHOLDER (replaced by installer with actual path)
#   - Updater volume mapped to actual install path (not hardcoded /opt/project-nomad)
#
# Security hardening (vs upstream):
#   - Admin and Dozzle bound to localhost only (not exposed to LAN by default)
#   - Redis requires authentication
#   - Network segmentation: only admin can reach backend services
#   - Credentials file permissions set to 600 by installer
#
# To expose to your LAN, change "127.0.0.1:8080:8080" to "8080:8080" in the admin ports below.
#
# Ollama runs NATIVELY on macOS (not in Docker) for Apple Metal GPU acceleration.
# Configure in the N.O.M.A.D. UI: Settings → Models → Remote Ollama Server → http://host.docker.internal:11434

name: project-nomad
services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:latest
    pull_policy: always
    container_name: nomad_admin
    restart: unless-stopped
    ports:
      # Bound to localhost by default for security. To expose to your LAN,
      # change to "8080:8080" and access via http://<your-ip>:8080
      - "127.0.0.1:8080:8080"
    volumes:
      - NOMAD_DIR_PLACEHOLDER/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock  # Required: allows admin to manage Docker services
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      # PORT is the internal container port — change the host port in the "ports" mapping above
      - PORT=8080
      - LOG_LEVEL=info
      # APP_KEY must be at least 16 chars — auto-generated by the installer
      - APP_KEY=replaceme
      # HOST 0.0.0.0 listens on all interfaces inside the container (required for port mapping to work)
      - HOST=0.0.0.0
      # URL should match how you access the admin interface from your browser
      - URL=replaceme
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      # Must match MYSQL_PASSWORD below
      - DB_PASSWORD=replaceme
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=replaceme_redis
      - DISABLE_COMPRESSION=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dozzle:
    # Optional: container log viewer accessible at http://localhost:9999
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      # Bound to localhost only — Dozzle has no authentication and shows container logs
      # which may contain sensitive information. Do NOT expose to LAN unless you add auth.
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: reads container logs
    environment:
      - DOZZLE_ENABLE_ACTIONS=false  # Disabled — unauthenticated container stop/restart
      - DOZZLE_ENABLE_SHELL=false    # Disabled — shell access + Docker socket = privilege escalation
    networks:
      - frontend

  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=replaceme
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      # Must match DB_PASSWORD above
      - MYSQL_PASSWORD=replaceme
    volumes:
      - NOMAD_DIR_PLACEHOLDER/mysql:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "replaceme_redis"]
    volumes:
      - NOMAD_DIR_PLACEHOLDER/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "replaceme_redis", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  updater:
    # Lightweight sidecar that enables self-updates from the N.O.M.A.D. UI
    # Trust boundary: this container has Docker socket + R/W access to the install directory
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required: pulls and restarts containers
      - NOMAD_DIR_PLACEHOLDER:NOMAD_DIR_PLACEHOLDER  # Required: updates compose file
      - nomad-update-shared:/shared
    networks:
      - frontend

  # NOTE: disk-collector is intentionally excluded on macOS.
  # The Linux version mounts /:/host:ro,rslave and uses lsblk + /proc — neither works on macOS.
  # The admin UI handles missing disk data gracefully.
  # Future: a native macOS disk info script via launchd could provide this data.

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  nomad-update-shared:
    driver: local
